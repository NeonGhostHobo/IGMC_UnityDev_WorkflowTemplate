rules:
  - id: repository.contract.present
    category: repository-contract
    severity: critical
    weight: 5
    check:
      type: path-exists
      path: .igmc/repository.json
    remediation:
      type: create-from-template
      safe: false

  - id: repository.contract.valid
    category: repository-contract
    severity: critical
    weight: 10
    check:
      type: schema-valid
      schema: standard/schemas/repository.schema.json
    remediation:
      type: edit-contract
      safe: false

  - id: documentation.required-artifacts-present
    category: documentation
    severity: required
    weight: 10
    check:
      type: paths-exist
      paths:
        - docs/README.md
        - docs/design
    remediation:
      type: create-missing-artifacts
      safe: false

  - id: codex.instructions-present
    category: ai-configuration
    severity: required
    weight: 5
    check:
      type: path-exists
      path: AGENTS.md
    remediation:
      type: install-managed-asset
      safe: false

  - id: codex.skills-present
    category: ai-configuration
    severity: required
    weight: 5
    check:
      type: path-exists
      path: .agents/skills
    remediation:
      type: install-managed-asset
      safe: false
