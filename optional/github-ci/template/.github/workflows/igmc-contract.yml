name: IGMC contract validation (optional)

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate repository contract
        run: python scripts/validate_repository_contract.py .

# This opt-in workflow is deterministic. It does not invoke Codex, an AI API,
# remote agent execution, issue automation, commits, pushes, or paid services.
